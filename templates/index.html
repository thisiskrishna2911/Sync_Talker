<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SadTalker Web UI</title>
    <!-- Link to the CSS file in the static/css folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="container">
        <h1>SadTalker - Make Your Image Talk</h1>
        <form method="POST" enctype="multipart/form-data">
            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <label for="audio">Upload Audio:</label>
            <input type="file" id="audio" name="audio" accept="audio/*" required>

            <div class="radio-container">
                <label>Select resolution</label>
                <div class="radio-group">
                    <input type="radio" id="res256" name="res" value="256" checked>
                    <label for="res256">256</label>
                    <input type="radio" id="res512" name="res" value="512">
                    <label for="res512">512</label>
                </div>
            </div>

            <button type="submit">Generate Talking Video</button>
        </form>
    </div>
    <!-- Link to the JavaScript file in the static/js folder -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
